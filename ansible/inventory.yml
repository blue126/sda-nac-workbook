---
# Devices outside Catalyst Center. Fabric nodes are managed by Terraform (../data/).
all:
  children:
    fusion:
      hosts:
        FUSION-1:
          ansible_host: 192.168.1.99
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        # Credentials are not stored here: export FUSION_USER, and pass the
        # password with --ask-pass (-k) or ANSIBLE_NET_PASSWORD.
        ansible_user: "{{ lookup('ansible.builtin.env', 'FUSION_USER') }}"
