---
# Task 7 (Stage 0): sub-interfaces and eBGP peerings from FUSION-1 to both borders.
# The fusion side is not VRF-aware: all GRT routes are leaked into the CORP VN.
# Run before the fabric exists; the sessions stay down until Stage 3 creates the border
# SVIs. After Stage 3: ansible-playbook fusion_handoff.yml -k --tags verify
- name: Fusion side of the SD-Access L3 handoff
  hosts: fusion
  gather_facts: false

  tasks:
    - name: Sub-interface per handoff VLAN
      cisco.ios.ios_config:
        parents: "interface {{ item.parent }}.{{ item.vlan }}"
        lines:
          - "description L3 handoff {{ item.vn }} to {{ item.pool }}"
          - "encapsulation dot1Q {{ item.vlan }}"
          - "ip address {{ item.local_ip }} {{ item.mask }}"
      loop: "{{ l3_handoffs }}"
      loop_control:
        label: "{{ item.parent }}.{{ item.vlan }}"

    - name: eBGP neighbor per border
      cisco.ios.ios_bgp_global:
        config:
          as_number: "{{ bgp_asn }}"
          neighbors:
            - neighbor_address: "{{ item.border_ip }}"
              remote_as: "{{ fabric_asn }}"
              description: "border {{ item.pool }}"
        state: merged
      loop: "{{ l3_handoffs }}"
      loop_control:
        label: "{{ item.border_ip }}"

    - name: Save configuration
      cisco.ios.ios_config:
        save_when: modified

    - name: Wait for the BGP sessions to come up (after Stage 3 only)
      tags: [never, verify]
      cisco.ios.ios_command:
        commands: "show ip bgp neighbors {{ item.border_ip }} | include BGP state"
        wait_for: result[0] contains Established
        retries: 12
        interval: 10
      loop: "{{ l3_handoffs }}"
      loop_control:
        label: "{{ item.border_ip }}"
