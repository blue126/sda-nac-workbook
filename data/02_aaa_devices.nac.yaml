---
# Stage 2 (workbook Task 9 + Task 10). Task 8 (ISE integration) lives in ise.tf.
# Field names checked against module 0.6.0 (cc_network_settings.tf, cc_device_provision.tf).
catalyst_center:
  sites:
    areas:
      - name: USA
        buildings:
          - name: SDA-Campus
            network_settings:
              # Task 9: client/endpoint authentication goes to ISE. ISE must already be
              # integrated (ise.tf) before this is applied.
              client_and_endpoint_aaa:
                server_type: ISE
                protocol: RADIUS
                primary_ip: 192.168.1.221

  inventory:
    # name = CatC hostname without the domain; fqdn_name = hostname as CatC shows it
    # (devices have "ip domain name ccie.local"). device_ip = Loopback0 used for discovery.
    devices:
      # Task 10: fabric nodes are assigned and provisioned to the building.
      - name: HQ-BCP-1
        fqdn_name: HQ-BCP-1.ccie.local
        device_ip: 9.9.9.11
        site: Global/USA/SDA-Campus
        device_role: BORDER ROUTER
        state: PROVISION
      - name: HQ-BCP-2
        fqdn_name: HQ-BCP-2.ccie.local
        device_ip: 9.9.9.12
        site: Global/USA/SDA-Campus
        device_role: BORDER ROUTER
        state: PROVISION
      - name: HQ-EDGE-1
        fqdn_name: HQ-EDGE-1.ccie.local
        device_ip: 9.9.9.31
        site: Global/USA/SDA-Campus
        device_role: ACCESS
        state: PROVISION
      - name: HQ-EDGE-2
        fqdn_name: HQ-EDGE-2.ccie.local
        device_ip: 9.9.9.32
        site: Global/USA/SDA-Campus
        device_role: ACCESS
        state: PROVISION
      # Intermediate nodes only carry the underlay: assigned to the site, not provisioned.
      - name: HQ-IN-1
        fqdn_name: HQ-IN-1.ccie.local
        device_ip: 9.9.9.21
        site: Global/USA/SDA-Campus
        device_role: DISTRIBUTION
        state: ASSIGN
      - name: HQ-IN-2
        fqdn_name: HQ-IN-2.ccie.local
        device_ip: 9.9.9.22
        site: Global/USA/SDA-Campus
        device_role: DISTRIBUTION
        state: ASSIGN
