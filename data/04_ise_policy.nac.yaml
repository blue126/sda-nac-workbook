---
# Stage 4: micro-segmentation and identity on ISE (nac-ise). Tasks 24-28.
# Policy stays on ISE (not migrated to Catalyst Center GBAC); see WORKBOOK Task 23.
ise:
  # Task 24: SGT policy matrix. Employees / Contractors / Developers are ISE's built-in SGTs,
  # and Permit IP / Deny IP are built-in SGACLs, so they are referenced here, not created.
  trust_sec:
    # Contractors is denied to and from everyone, itself included; everything else is permitted.
    matrix_entries:
      - { source_sgt: Employees, destination_sgt: Employees, sgacl_name: Permit IP }
      - { source_sgt: Employees, destination_sgt: Contractors, sgacl_name: Deny IP }
      - { source_sgt: Employees, destination_sgt: Developers, sgacl_name: Permit IP }
      - { source_sgt: Contractors, destination_sgt: Employees, sgacl_name: Deny IP }
      - { source_sgt: Contractors, destination_sgt: Contractors, sgacl_name: Deny IP }
      - { source_sgt: Contractors, destination_sgt: Developers, sgacl_name: Deny IP }
      - { source_sgt: Developers, destination_sgt: Employees, sgacl_name: Permit IP }
      - { source_sgt: Developers, destination_sgt: Contractors, sgacl_name: Deny IP }
      - { source_sgt: Developers, destination_sgt: Developers, sgacl_name: Permit IP }

  identity_management:
    # Task 25: user identity groups
    user_identity_groups:
      - name: SDA_Employees
      - name: SDA_Contractors
      - name: SDA_Developers

    # Task 26: local users. One lab password for all of them, from .env (ISE_LAB_USER_PASSWORD).
    internal_users:
      - name: bob
        password: !env ISE_LAB_USER_PASSWORD
        password_version: 1
        change_password: false
        user_identity_groups: [SDA_Employees]
      - name: joe
        password: !env ISE_LAB_USER_PASSWORD
        password_version: 1
        change_password: false
        user_identity_groups: [SDA_Contractors]
      - name: susan
        password: !env ISE_LAB_USER_PASSWORD
        password_version: 1
        change_password: false
        user_identity_groups: [SDA_Contractors]
      - name: kim
        password: !env ISE_LAB_USER_PASSWORD
        password_version: 1
        change_password: false
        user_identity_groups: [SDA_Developers]

  network_access:
    policy_elements:
      # Task 27: Access-Accept with VLAN 100 (VLAN name on the edges is VLAN_100, from Task 21)
      authorization_profiles:
        - name: SDA_VLAN100
          access_type: ACCESS_ACCEPT
          vlan_name_id: VLAN_100
          vlan_tag_id: 1

    # Task 28: policy set for wired access: 802.1X users authenticate against Internal Users and
    # are authorized by identity group (VLAN 100 plus the group's SGT). Wired MAB is matched here
    # too and rejected, so it never falls through to the Default policy set, whose factory MAB
    # rule (user not found: CONTINUE) would end in PermitAccess.
    policy_sets:
      - name: SDA-Campus
        description: SD-Access fabric wired access
        service_name: Default Network Access
        condition:
          type: ConditionOrBlock
          children:
            - type: ConditionReference
              name: Wired_802.1X
            - type: ConditionReference
              name: Wired_MAB
        authentication_rules:
          - name: MAB
            condition:
              type: ConditionReference
              name: Wired_MAB
            identity_source_name: Internal Endpoints
            if_user_not_found: REJECT
          - name: Default
            identity_source_name: Internal Users
        authorization_rules:
          - name: Employees
            condition:
              type: ConditionAttributes
              dictionary_name: IdentityGroup
              attribute_name: Name
              operator: equals
              attribute_value: User Identity Groups:SDA_Employees
            profiles: [SDA_VLAN100]
            security_group: Employees
          - name: Contractors
            condition:
              type: ConditionAttributes
              dictionary_name: IdentityGroup
              attribute_name: Name
              operator: equals
              attribute_value: User Identity Groups:SDA_Contractors
            profiles: [SDA_VLAN100]
            security_group: Contractors
          - name: Developers
            condition:
              type: ConditionAttributes
              dictionary_name: IdentityGroup
              attribute_name: Name
              operator: equals
              attribute_value: User Identity Groups:SDA_Developers
            profiles: [SDA_VLAN100]
            security_group: Developers
          - name: Default
            profiles: [DenyAccess]
