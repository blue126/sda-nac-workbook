---
# Stage 1 (workbook Tasks 10-12): site hierarchy, global pool, building reservations,
# Catalyst Center to ISE integration.
# Field names checked against module 0.6.0 source (cc_sites.tf, cc_network_settings.tf,
# cc_system_settings.tf).
catalyst_center:
  # Task 12: integrate ISE. Credentials come from environment variables (!env, see
  # .env.example), never from this file. With *_version set the module uses write-only
  # arguments, so the secrets are not stored in state. Bump the version after changing
  # a secret.
  system_settings:
    authentication_and_policy_servers:
      ise:
        ip_address: 192.168.1.221
        fqdn: ise.ccie.local
        username: !env ISE_USERNAME
        password: !env ISE_PASSWORD
        password_version: 1
        shared_secret: !env ISE_SHARED_SECRET
        shared_secret_version: 1
        pxgrid_enabled: true
        retries: 3
        timeout: 4
        protocols:
          radius:
            authentication_port: 1812
            accounting_port: 1813

  sites:
    global:
      network_settings:
        ip_pools:
          # No gateway/DHCP/DNS at the global level; they are set on the reservation.
          - name: SDA-Campus
            ip_address_space: IPv4
            ip_pool_cidr: 10.254.0.0/16
    areas:
      - name: USA
        buildings:
          - name: SDA-Campus
            country: United States
            # CatC rejects a building without lat/long or address (NCND10502).
            # Placeholder: San Jose, CA.
            latitude: 37.41
            longitude: -121.95
            network_settings:
              ip_pools_reservations:
                # Anycast gateway pool for VLAN 100. DHCP on NET-SVC (PNETLab Net Services, 192.168.1.98);
                # DNS forwarded by FUSION-1 (192.168.1.99). Both are outside the fabric, reached via the L3 handoff.
                - name: SDA-Campus-VLAN-100
                  global_pool: SDA-Campus
                  subnet: 10.254.100.0
                  prefix_length: 24
                  gateway: 10.254.100.1
                  dhcp_servers: [192.168.1.98]
                  dns_servers: [192.168.1.99]
                # /30 transfer links for the border-to-fusion L3 handoff (Task 20).
                - name: SDA-Campus-L3-Handoff-1
                  global_pool: SDA-Campus
                  subnet: 10.254.251.0
                  prefix_length: 30
                - name: SDA-Campus-L3-Handoff-2
                  global_pool: SDA-Campus
                  subnet: 10.254.252.0
                  prefix_length: 30
